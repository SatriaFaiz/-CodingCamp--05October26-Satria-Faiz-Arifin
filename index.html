<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="dashboard">

    <!-- ===== Greeting Section ===== -->
    <section id="greeting-section" class="card" aria-label="Greeting">
      <div id="clock" aria-live="polite" aria-atomic="true">00:00:00</div>
      <div id="date"></div>
      <div id="greeting-text"></div>
    </section>

    <!-- ===== Focus Timer Section ===== -->
    <section id="timer-section" class="card" aria-label="Focus Timer">
      <h2>Focus Timer</h2>
      <div id="timer-display" aria-live="polite" aria-atomic="true">25:00</div>
      <div id="timer-message" class="timer-message" role="status" aria-live="polite" hidden></div>
      <div class="timer-controls">
        <button id="timer-start" type="button">Start</button>
        <button id="timer-stop" type="button" disabled>Stop</button>
        <button id="timer-reset" type="button">Reset</button>
      </div>
    </section>

    <!-- ===== To-Do List Section ===== -->
    <section id="todo-section" class="card" aria-label="To-Do List">
      <h2>To-Do List</h2>
      <div class="todo-add-form">
        <label for="todo-input" class="visually-hidden">New task description</label>
        <input
          id="todo-input"
          type="text"
          placeholder="Add a new task…"
          maxlength="200"
          autocomplete="off"
          aria-describedby="todo-input-error"
        />
        <button id="todo-add-btn" type="button">Add</button>
      </div>
      <span id="todo-input-error" class="error-msg" role="alert" aria-live="assertive"></span>
      <ul id="todo-list" aria-label="Task list"></ul>
    </section>

    <!-- ===== Quick Links Section ===== -->
    <section id="links-section" class="card" aria-label="Quick Links">
      <h2>Quick Links</h2>
      <div class="links-add-form">
        <div class="form-field">
          <label for="link-label-input" class="visually-hidden">Link label</label>
          <input
            id="link-label-input"
            type="text"
            placeholder="Label (e.g. GitHub)"
            maxlength="50"
            autocomplete="off"
            aria-describedby="link-label-error"
          />
          <span id="link-label-error" class="error-msg" role="alert" aria-live="assertive"></span>
        </div>
        <div class="form-field">
          <label for="link-url-input" class="visually-hidden">Link URL</label>
          <input
            id="link-url-input"
            type="text"
            placeholder="URL (e.g. https://github.com)"
            maxlength="2048"
            autocomplete="off"
            aria-describedby="link-url-error"
          />
          <span id="link-url-error" class="error-msg" role="alert" aria-live="assertive"></span>
        </div>
        <button id="link-add-btn" type="button">Add Link</button>
      </div>
      <p id="link-cap-message" class="cap-message" role="status" aria-live="polite" hidden>
        Maximum of 20 links reached.
      </p>
      <div id="links-list" class="links-list" aria-label="Quick links list"></div>
    </section>

  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
